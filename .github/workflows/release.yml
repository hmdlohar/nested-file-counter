name: release
on:
  push:
    tags: ["v*"]              # e.g. v0.1.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0); leave empty to use current ref"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: hnfc-linux-amd64.tar.gz
            use_zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: hnfc-linux-arm64.tar.gz
            use_zig: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: hnfc-darwin-amd64.tar.gz
            use_zig: false
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: hnfc-darwin-arm64.tar.gz
            use_zig: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: hnfc-windows-amd64.zip
            use_zig: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Only needed for linux musl cross builds; no host zig needed otherwise
      - name: Install zig (linux musl only)
        if: matrix.use_zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild (linux musl only)
        if: matrix.use_zig
        run: cargo install cargo-zigbuild --locked

      - name: Build (zig)
        if: matrix.use_zig
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.use_zig }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          BIN="target/${{ matrix.target }}/release/hnfc"
          [ -f "$BIN" ]
          strip "$BIN" 2>/dev/null || true
          STAGE="$(mktemp -d)"
          cp "$BIN" "$STAGE/hnfc"
          cp README.md "$STAGE/" 2>/dev/null || true
          cp LICENSE "$STAGE/" 2>/dev/null || true
          tar -czf "${{ matrix.asset }}" -C "$STAGE" hnfc $( [ -f "$STAGE/README.md" ] && echo README.md ) $( [ -f "$STAGE/LICENSE" ] && echo LICENSE )
          ls -lh "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/hnfc.exe"
          if (!(Test-Path $bin)) { throw "binary not found: $bin" }
          $stage = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "stage")
          Copy-Item $bin (Join-Path $stage "hnfc.exe")
          if (Test-Path README.md) { Copy-Item README.md $stage }
          if (Test-Path LICENSE) { Copy-Item LICENSE $stage }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "${{ matrix.asset }}" -Force
          Get-ChildItem "${{ matrix.asset }}" | Format-List
          (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.asset }}" | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"
          Get-Content "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Optional: also run on manual dispatch without creating a release
  smoke:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: ls -lh dist && cat dist/*.sha256 2>/dev/null || true
