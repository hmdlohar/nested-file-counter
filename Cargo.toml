[package]
name = "hnfc"
version = "0.1.0"
edition = "2021"
description = "hnfc — ncdu-like file count explorer (pure Docker build)"
license = "MIT"
repository = ""
keywords = ["tui", "ncdu", "file-count", "disk-usage"]
categories = ["command-line-utilities"]

[[bin]]
name = "hnfc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
globset = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
